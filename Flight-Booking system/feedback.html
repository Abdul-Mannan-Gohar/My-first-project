<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkyHigh Feedback</title>
<link rel="stylesheet" href="css/feedback.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>
<body>

<!-- Header -->
<header>
  <div class="logo">Sky<span>High</span></div>
  <div class="icons">
   <a href="login.html" > <i class="fas fa-user-circle" title="Login"></i></a>
    <i class="fas fa-bars" onclick="openMenu()" title="Menu"></i>
  </div>
</header>

<!-- Sidebar -->
 <div id="sidebarMenu" class="sidebar">
      <span class="closebtn" onclick="closeMenu()">
  <i class="fa-solid fa-xmark"></i></span>
   <a href="index.html"><i class="fas fa-home"></i> Home</a>
    <a href="book.html"><i class="fas fa-plane-departure"></i> Book</a>
    <a href="manage.html"><i class="fas fa-cog"></i> Manage</a>
    <a href="experience.html"><i class="fas fa-globe"></i> Experience</a>
    <a href="destination.html"><i class="fas fa-map-marked-alt"></i> Where We Fly</a>
    <a href="loyalty.html"><i class="fas fa-gem"></i> Loyalty</a>
    <a href="help.html"><i class="fas fa-question-circle"></i> Help</a>
   
  </div>

<!-- Hero Section -->
<section class="hero">
  <h1>Share Your Feedback with SkyHigh</h1>
  <p>Help us improve by telling us what you think about our services.</p>
</section>

<!-- Feedback Form -->
<section class="feedback">
  <h2>We Value Your Feedback</h2>
  <p>Your opinion helps us provide better services. Please fill the form below.</p>
  
  <form class="feedback-form">
    <div class="input-block">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Your Name" required>
    </div>

    <div class="input-block">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Your Email" required>
    </div>

    <div class="input-block">
   <label class="rating-title">Rating</label>
<div class="stars">
    <input type="checkbox" id="star5" value="5">
    <label for="star5">&#9733;</label>

    <input type="checkbox" id="star4" value="4">
    <label for="star4">&#9733;</label>

    <input type="checkbox" id="star3" value="3">
    <label for="star3">&#9733;</label>

    <input type="checkbox" id="star2" value="2">
    <label for="star2">&#9733;</label>

    <input type="checkbox" id="star1" value="1">
    <label for="star1">&#9733;</label>
</div>


    <div class="input-block">
      <label for="comments">Comments</label>
      <textarea id="comments" name="comments" placeholder="Your Comments" rows="5" required></textarea>
    </div>

    <div class="input-block">
      <input type="submit" value="Submit Feedback">
    </div>
  </form>
</section>

<!-- Footer -->
<footer>
  &copy; 2025 SkyHigh. All Rights Reserved.
</footer>

<script src="js/script.js">
</script>

</body>
</html>
