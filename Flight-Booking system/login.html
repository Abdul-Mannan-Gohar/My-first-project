<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyHigh|Login Rigistration</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
     <header>
    <div class="logo"><a href="index.html">Sky<span>High</span></a></div>
    <div class="icons">
  <a href="index.html"><i class="fas fa-home" title="Home"></i></a>
  </div>
  </header>

 
    <div class="container">
        <div class="form-box login">
            <form action="#">
                <h1>Login</h1>
                <div class="input-box">
                    <input type="text" placeholder="Username" required>
                    <i class="fa-solid fa-user"></i>
                </div>
                <div class="input-box">
                    <input type="password" placeholder="Password" required>
                    <i class="fa-solid fa-lock"></i>
                </div>
                <div class="forgot-link">
                    <a href="#">Forgot Password</a>
                </div>
                <button type="submit" class="btn">
                    Login</button>
                    <p>Or login with social media plateforms</p>
                    <div class="social-icons">
                        <a href="#"><i class="fa-brands fa-google"></i></a>
                        <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
                        <a href="#"><i class="fa-brands fa-github"></i></a>
                        <a href="#"><i class="fa-brands fa-linkedin-in"></i></a>
                    </div>
            </form>
        </div>
        <div class="form-box rigister">
              <form action="#">
                <h1>Registration</h1>
                <div class="input-box">
                    <input type="text" placeholder="Username" required>
                    <i class="fa-solid fa-user"></i>
                </div>
                <div class="input-box">
                    <input type="email" placeholder="E-mail" required>
                    <i class="fa-solid fa-envelope"></i>
                </div>
                <div class="input-box">
                    <input type="password" placeholder="Password" required>
                    <i class="fa-solid fa-lock"></i>
                </div>
               
                <button type="submit" class="btn">Register</button>
                    <p>Or Register with social media plateforms</p>
                    <div class="social-icons">
                       <a href="#"><i class="fa-brands fa-google"></i></a>
                        <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
                        <a href="#"><i class="fa-brands fa-github"></i></a>
                        <a href="#"><i class="fa-brands fa-linkedin-in"></i></a>
                    </div>
            </form>
        </div>
        <div class="toggle-box">
        <div class="toggle-panel toggle-left">
             <h1>Wellcome</h1>
            <p>Already have an acount</p>
            <button class="btn register-btn">Login</button>
        </div>
        <div class="toggle-panel toggle-right">
            <h1>Wellcome back</h1>
            <p> Don't have an acount?</p>
            <button class="btn login-btn"> Register</button>
        </div>

        </div>
    </div>
    <script src="js/login.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
